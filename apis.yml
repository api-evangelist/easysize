apis:
- name: EasySize Fit Quiz JavaScript Library
  description: >-
    Client-side JavaScript library that embeds the EasySize "Fit Quiz" size-recommendation
    widget on a merchant storefront. Loaded via a script tag from the EasySize web app CDN,
    it exposes a global EasySize object configured with a merchant shop_id plus product
    context, and provides hooks for size selection, order tracking, and return tracking.
